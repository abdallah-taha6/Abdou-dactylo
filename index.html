<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dactylo Tchad</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
}

h1 {
    font-size: 32px;
}

select {
    padding: 10px;
    font-size: 17px;
    border-radius: 8px;
    margin: 10px;
}

.text-to-type {
    background: #eeeeee;
    padding: 20px;
    border-radius: 10px;
    font-size: 20px;
    text-align: left;
    margin: 20px 0;
}

textarea {
    width: 95%;
    height: 150px;
    font-size: 19px;
    padding: 12px;
    border: 2px solid #999;
    border-radius: 10px;
    resize: none;
}

button {
    margin: 10px 5px;
    padding: 12px 25px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    font-size: 19px;
}
</style>
</head>

<body>

<div class="container">

<h1>⌨️ Dactylo Tchad</h1>

<p>Choisis ton niveau :</p>

<select id="level" onchange="changeLevel()">
    <option value="beginner">🟢 Débutant</option>
    <option value="medium">🟡 Intermédiaire</option>
    <option value="advanced">🔴 Avancé</option>
</select>

<div class="text-to-type" id="text"></div>

<textarea
id="input"
placeholder="⌨️ Tape le texte ici..."
disabled>
</textarea>

<br>

<button onclick="startTest()">▶️ Commencer</button>

<button onclick="newText()">📝 Nouveau texte</button>

<button onclick="restartTest()">🔄 Recommencer</button>

<div id="result">
Choisis un niveau puis commence le test.
</div>

</div>

<script>

const texts = {

beginner: [
"Je tape sur mon clavier pour apprendre la dactylographie.",
"Le clavier est utile pour écrire des textes sur un ordinateur.",
"Je pratique chaque jour pour améliorer ma vitesse.",
"J'apprends à utiliser mon ordinateur avec confiance.",
"La dactylographie demande de la patience et de la pratique."
],

medium: [
"Apprendre à taper rapidement au clavier demande de la pratique et de la concentration.",
"Un bon utilisateur d'ordinateur doit connaître les principales touches du clavier.",
"La pratique régulière permet d'améliorer progressivement la vitesse et la précision.",
"Je veux apprendre la dactylographie afin de travailler plus rapidement sur mes documents.",
"Un clavier bien maîtrisé permet de saisir facilement des lettres, des chiffres et des symboles."
],

advanced: [
"La maîtrise de la dactylographie permet de travailler efficacement sur un ordinateur et de gagner beaucoup de temps.",
"Une bonne vitesse de frappe associée à une excellente précision peut faciliter la réalisation de nombreux travaux professionnels.",
"La dactylographie est une compétence importante pour les personnes qui utilisent régulièrement un ordinateur pour leurs études ou leur travail.",
"Pour progresser rapidement, il est préférable de pratiquer régulièrement plutôt que de chercher uniquement à taper très vite.",
"Une personne qui maîtrise son clavier peut se concentrer davantage sur ses idées sans être constamment interrompue par la recherche des touches."
]

};

let startTime;
let testStarted = false;
let text = "";

const textElement = document.getElementById("text");
const input = document.getElementById("input");
const result = document.getElementById("result");
const level = document.getElementById("level");

function chooseRandomText() {

    const list = texts[level.value];

    const randomIndex =
        Math.floor(Math.random() * list.length);

    text = list[randomIndex];

    textElement.innerText = text;
}

function changeLevel() {

    chooseRandomText();

    input.value = "";
    input.disabled = true;

    result.innerHTML =
        "Niveau sélectionné : " +
        level.options[level.selectedIndex].text;

    testStarted = false;
}

function newText() {

    chooseRandomText();

    input.value = "";
    input.disabled = true;

    result.innerHTML =
        "📝 Nouveau texte sélectionné !";

    testStarted = false;
}

function startTest() {

    input.disabled = false;
    input.value = "";
    input.focus();

    startTime = new Date();
    testStarted = true;

    result.innerHTML =
        "⌨️ Tape le texte ci-dessus...";

}

input.addEventListener("input", function() {

    if (!testStarted) return;

    if (input.value === text) {

        const endTime = new Date();

        const seconds =
            (endTime - startTime) / 1000;

        const words =
            text.trim().split(/\s+/).length;

        const speed =
            Math.round(words / (seconds / 60));

        let correct = 0;

        for (let i = 0; i < input.value.length; i++) {

            if (input.value[i] === text[i]) {
                correct++;
            }

        }

        const precision =
            Math.round((correct / text.length) * 100);

        result.innerHTML =
            "🎉 <strong>Test terminé !</strong><br><br>" +
            "⚡ Vitesse : " + speed + " mots/minute<br>" +
            "⏱️ Temps : " + seconds.toFixed(1) + " secondes<br>" +
            "🎯 Précision : " + precision + "%";

        input.disabled = true;
        testStarted = false;
    }

});

function restartTest() {

    input.value = "";
    input.disabled = true;

    result.innerHTML =
        "Prêt pour un nouveau test.";

    testStarted = false;
}

chooseRandomText();

</script>

</body>
</html>
