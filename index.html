<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dactylo Tchad</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
}

h1 {
    font-size: 32px;
}

.instructions {
    font-size: 18px;
}

.text-to-type {
    background: #eeeeee;
    padding: 20px;
    border-radius: 10px;
    font-size: 20px;
    text-align: left;
    margin: 20px 0;
}

textarea {
    width: 95%;
    height: 150px;
    font-size: 19px;
    padding: 12px;
    border: 2px solid #999;
    border-radius: 10px;
    resize: none;
}

button {
    margin: 10px 5px;
    padding: 12px 25px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    font-size: 19px;
}
</style>
</head>

<body>

<div class="container">

<h1>⌨️ Dactylo Tchad</h1>

<p class="instructions">
Recopie le texte ci-dessous le plus rapidement possible.
</p>

<div class="text-to-type" id="text">
Le clavier est un outil important pour apprendre à utiliser un ordinateur.
</div>

<textarea
id="input"
placeholder="⌨️ Tape le texte ici..."
disabled>
</textarea>

<br>

<button onclick="startTest()">▶️ Commencer</button>

<button onclick="restartTest()">🔄 Recommencer</button>

<div id="result">
Le test n'a pas encore commencé.
</div>

</div>

<script>

let startTime;
let testStarted = false;

const text = document.getElementById("text").innerText;
const input = document.getElementById("input");
const result = document.getElementById("result");

function startTest() {

    input.disabled = false;
    input.value = "";
    input.focus();

    startTime = new Date();
    testStarted = true;

    result.innerHTML = "⌨️ Tape le texte ci-dessus...";

}

input.addEventListener("input", function() {

    if (!testStarted) return;

    if (input.value === text) {

        const endTime = new Date();

        const seconds =
            (endTime - startTime) / 1000;

        const words =
            text.trim().split(/\s+/).length;

        const speed =
            Math.round(words / (seconds / 60));

        let correct = 0;

        for (let i = 0; i < input.value.length; i++) {

            if (input.value[i] === text[i]) {
                correct++;
            }

        }

        const precision =
            Math.round((correct / text.length) * 100);

        result.innerHTML =
            "🎉 <strong>Test terminé !</strong><br><br>" +
            "⚡ Vitesse : " + speed + " mots/minute<br>" +
            "⏱️ Temps : " + seconds.toFixed(1) + " secondes<br>" +
            "🎯 Précision : " + precision + "%";

        input.disabled = true;
        testStarted = false;
    }

});

function restartTest() {

    input.value = "";
    input.disabled = true;

    result.innerHTML =
        "Le test n'a pas encore commencé.";

    testStarted = false;
}

</script>

</body>
</html>
